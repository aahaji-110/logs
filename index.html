<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>أداة حساب ساعات المسعفين - نظام الإنجاز</title>
    <style>
        :root {
            --primary: #007bff;
            --success: #28a745;
            --warning: #e67e22;
            --bg-body: #f4f7f6;
            --bg-card: #ffffff;
            --text-main: #2c3e50;
            --border: #d1d1d1;
            --shadow: 0 8px 30px rgba(0,0,0,0.1);
        }

        .dark-mode {
            --bg-body: #121212;
            --bg-card: #1e1e1e;
            --text-main: #ecf0f1;
            --border: #333;
            --shadow: 0 8px 30px rgba(0,0,0,0.4);
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-body);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            transition: all 0.3s ease;
        }

        .container {
            background: var(--bg-card);
            padding: 30px;
            border-radius: 20px;
            box-shadow: var(--shadow);
            width: 100%;
            max-width: 420px;
            text-align: center;
            position: relative;
        }

        .theme-switch {
            position: absolute;
            top: 15px;
            left: 15px;
            cursor: pointer;
            background: var(--bg-body);
            padding: 6px 10px;
            border-radius: 50px;
            font-size: 12px;
            border: 1px solid var(--border);
            user-select: none;
            transition: 0.3s;
            z-index: 10;
        }

        .logo-img {
            max-width: 140px;
            margin-top: -10px; 
            margin-bottom: 10px;
            filter: drop-shadow(0 4px 6px rgba(0,0,0,0.1));
        }

        h2 { 
            margin: 0 auto 25px auto;
            font-size: 24px; 
            border-bottom: 3px solid var(--primary);
            display: table;
            padding-bottom: 5px;
            font-weight: 800;
        }
        
        .label { 
            font-weight: bold; 
            margin-bottom: 8px; 
            display: block; 
            text-align: right; 
            font-size: 14px; 
        }
        
        input {
            width: 100%;
            padding: 12px;
            margin-bottom: 15px;
            border: 1px solid var(--border);
            border-radius: 10px;
            box-sizing: border-box;
            background-color: var(--bg-card);
            color: var(--text-main);
            text-align: center;
            font-size: 16px;
            transition: 0.3s;
        }

        input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 8px rgba(0,123,255,0.2);
        }

        .calc-options {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }
        
        .option-item { 
            flex: 1;
            display: flex; 
            align-items: center; 
            justify-content: center;
            font-size: 13px; 
            cursor: pointer; 
            background: var(--bg-body);
            padding: 10px;
            border-radius: 8px;
            border: 1px solid var(--border);
            transition: 0.3s;
        }
        
        .option-item:hover { border-color: var(--primary); }
        .option-item input { width: auto; margin: 0 0 0 8px; cursor: pointer; }

        #progressContainer {
            background: #eee;
            height: 25px; 
            border-radius: 12px;
            margin-bottom: 5px;
            overflow: hidden;
            display: none;
            position: relative;
            border: 1px solid var(--border);
        }
        #progressBar {
            height: 100%;
            background: linear-gradient(90deg, #28a745, #20c997);
            width: 0%;
            transition: width 0.8s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: bold;
            font-size: 12px;
        }
        #remainingText {
            font-size: 13px;
            color: var(--warning);
            font-weight: bold;
            margin-bottom: 15px;
            display: none;
        }

        .btn-group {
            display: flex;
            gap: 10px;
        }

        button {
            flex: 2;
            padding: 14px;
            background-color: var(--primary);
            color: white;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
            transition: 0.3s;
        }

        button:hover { opacity: 0.9; transform: translateY(-2px); }

        .reset-btn { flex: 1; background-color: var(--warning); }

        #resultArea {
            width: 100%;
            height: 130px;
            margin-top: 20px;
            border: 2px dashed var(--success);
            background: rgba(40, 167, 69, 0.05);
            border-radius: 10px;
            padding: 10px;
            box-sizing: border-box;
            resize: none;
            font-weight: bold;
            color: var(--text-main);
            font-family: inherit;
            text-align: center;
        }

        .copy-btn { 
            background-color: var(--success); 
            margin-top: 15px; 
            width: 100%; 
        }

        .footer {
            margin-top: 25px;
            padding-top: 15px;
            border-top: 1px solid var(--border);
            font-size: 12px;
            color: #888;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="theme-switch" id="themeBtn" onclick="toggleTheme()">الوضع الداكن 🌙</div>
    
    <img src="https://www2.0zz0.com/2025/12/22/17/297618659.png" alt="شعار الأكاديمية" class="logo-img">

    <h2>حاسبة ساعات المسعفين</h2>
    
    <span class="label">رقم دسكورد المسعف:</span>
    <input type="number" id="copyID" placeholder="أدخل الرقم هنا">

    <span class="label">نوع الحسبة:</span>
    <div class="calc-options">
        <label class="option-item">
            <input type="radio" name="calcType" value="weekly" checked onclick="toggleProgress(false)"> حسبة أسبوعية
        </label>
        <label class="option-item">
            <input type="radio" name="calcType" value="30hours" onclick="toggleProgress(true)"> حسبة 30 ساعة
        </label>
    </div>

    <div id="progressContainer">
        <div id="progressBar">0%</div>
    </div>
    <div id="remainingText"></div>

    <span class="label">عدد اللوقات:</span>
    <input type="number" id="logsCount" placeholder="أدخل مجموع اللوقات" oninput="liveUpdate()">

    <div class="btn-group">
        <button onclick="calculateHours()">حساب</button>
        <button class="reset-btn" onclick="resetForm()">تصفير</button>
    </div>

    <textarea id="resultArea" readonly placeholder="سيظهر النص هنا..."></textarea>
    
    <button id="copyBtn" class="copy-btn" onclick="copyFinalText()" style="display: none;">نسخ</button>

    <div class="footer">
        الحقوق الفكرية محفوظة باسم <br>
        <strong>علي الحاجي aahaji_110</strong>
    </div>
</div>

<script>
    if(localStorage.getItem('theme') === 'dark') {
        document.body.classList.add('dark-mode');
        document.getElementById('themeBtn').innerText = "الوضع الداكن ☀️";
    }

    function toggleTheme() {
        document.body.classList.toggle('dark-mode');
        const isDark = document.body.classList.contains('dark-mode');
        document.getElementById('themeBtn').innerText = isDark ? "الوضع الداكن ☀️" : "الوضع الفاتح 🌙";
        localStorage.setItem('theme', isDark ? 'dark' : 'light');
    }

    function toggleProgress(show) {
        document.getElementById('progressContainer').style.display = show ? 'block' : 'none';
        document.getElementById('remainingText').style.display = show ? 'block' : 'none';
        if(!show) {
            document.getElementById('progressBar').style.width = '0%';
            document.getElementById('remainingText').innerText = '';
        } else {
            liveUpdate();
        }
    }

    function liveUpdate() {
        const logs = document.getElementById('logsCount').value;
        const calcType = document.querySelector('input[name="calcType"]:checked').value;
        
        if (calcType === "30hours" && logs !== "" && logs >= 0) {
            let hours = Math.round(parseFloat(logs) / 12);
            let percent = Math.min(Math.round((hours / 30) * 100), 100);
            let remaining = Math.max(30 - hours, 0);

            document.getElementById('progressBar').style.width = percent + '%';
            document.getElementById('progressBar').innerText = percent + '%';
            
            if (remaining > 0) {
                document.getElementById('remainingText').innerText = `باقي لك ${remaining} ساعة للوصول لـ 30`;
                document.getElementById('remainingText').style.color = "var(--warning)";
            } else {
                document.getElementById('remainingText').innerText = "✅ اكتملت الساعات (30/30)";
                document.getElementById('remainingText').style.color = "var(--success)";
            }
        }
    }

    function calculateHours() {
        const copyID = document.getElementById('copyID').value.trim();
        const logs = document.getElementById('logsCount').value;
        const resultArea = document.getElementById('resultArea');
        const copyBtn = document.getElementById('copyBtn');
        const calcType = document.querySelector('input[name="calcType"]:checked').value;

        if (logs !== "" && logs >= 0) {
            let roundedHours = Math.round(parseFloat(logs) / 12);
            let mention = copyID !== "" ? `<@${copyID}>` : "";
            
            liveUpdate();

            let title = (calcType === "weekly") 
                ? "ساعاتك هذا الاسبوع حتى تاريخ طلب المناقشة" 
                : "ساعاتك من اصل 30 ساعه حتى تاريخ طلب المناقشة";

            const template = `${title}
ساعاتك الاجمالية (${roundedHours})
شاكرين لـ اهتمامك
${mention}`;

            resultArea.value = template;
            copyBtn.style.display = 'block';
            copyBtn.innerText = "نسخ";
            copyBtn.style.backgroundColor = "var(--success)";
        } else {
            alert("يرجى إدخال عدد لوقات صحيح");
        }
    }

    function resetForm() {
        document.getElementById('copyID').value = "";
        document.getElementById('logsCount').value = "";
        document.getElementById('resultArea').value = "";
        document.getElementById('copyBtn').style.display = 'none';
        document.getElementById('progressBar').style.width = '0%';
        document.getElementById('progressBar').innerText = '0%';
        document.getElementById('remainingText').innerText = '';
        document.getElementById('progressContainer').style.display = 'none';
        document.getElementById('remainingText').style.display = 'none';
        document.querySelector('input[name="calcType"][value="weekly"]').checked = true;
    }

    async function copyFinalText() {
        const resultArea = document.getElementById('resultArea');
        const btn = document.getElementById('copyBtn');
        try {
            await navigator.clipboard.writeText(resultArea.value);
            btn.innerText = "✅ تم النسخ!";
            btn.style.backgroundColor = "#155724";
            setTimeout(() => {
                btn.innerText = "نسخ";
                btn.style.backgroundColor = "var(--success)";
            }, 2000);
        } catch (err) {
            alert("فشل النسخ");
        }
    }
</script>

</body>
</html>
